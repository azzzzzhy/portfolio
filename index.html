<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>作品集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #2c2c2c; }
  canvas { display: block; margin: 0 auto; }
  .bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.8); color: #fff;
    display: flex; justify-content: center; align-items: center;
    gap: 16px; padding: 10px; font-family: sans-serif;
    font-size: 14px; z-index: 10;
  }
  .bar button {
    background: #fff; color: #000; border: none;
    border-radius: 6px; padding: 10px 20px; font-size: 15px; cursor: pointer;
  }
  .bar button:disabled { opacity: 0.3; }
  .bar span { min-width: 80px; text-align: center; }
  #msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #ccc; font-family: sans-serif; font-size: 18px; z-index: 5;
  }
</style>
</head>
<body>
<div id="msg">加载中...</div>
<canvas id="c"></canvas>
<div class="bar">
  <button id="pb">◀ 上一页</button>
  <span id="pi"></span>
  <button id="nb">下一页 ▶</button>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.bootcdn.net/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var url = '%E4%BD%9C%E5%93%81%E9%9B%86.pdf';
var pdfDoc = null, pn = 1, tp = 0;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var msg = document.getElementById('msg');

function go(n) {
  msg.style.display = 'block';
  pdfDoc.getPage(n).then(function(page) {
    var s = Math.min((window.innerWidth - 16) / page.getViewport({scale:1}).width, 1.3);
    var vp = page.getViewport({scale: s});
    canvas.width = vp.width;
    canvas.height = vp.height;
    return page.render({canvasContext: ctx, viewport: vp}).promise;
  }).then(function() {
    msg.style.display = 'none';
    document.getElementById('pi').textContent = n + ' / ' + tp;
    document.getElementById('pb').disabled = n <= 1;
    document.getElementById('nb').disabled = n >= tp;
    window.scrollTo(0, 0);
  }).catch(function(e) {
    msg.textContent = '加载失败，请刷新重试';
    console.error(e);
  });
}

pdfjsLib.getDocument(url).promise.then(function(p) {
  pdfDoc = p;
  tp = p.numPages;
  go(1);
}).catch(function(e) {
  msg.textContent = 'PDF 加载失败，刷新试试';
  console.error(e);
});

document.getElementById('pb').onclick = function() { if (pn > 1) go(--pn); };
document.getElementById('nb').onclick = function() { if (pn < tp) go(++pn); };
</script>
</body>
</html>
